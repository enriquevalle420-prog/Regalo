<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#170d2c">
  <title>Para Crystalito 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: #fff8fc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 105, 180, .22), transparent 32%),
        radial-gradient(circle at 80% 75%, rgba(155, 110, 255, .24), transparent 35%),
        linear-gradient(145deg, #10091f, #24103d 55%, #130b2a);
    }
    .glow {
      position: fixed; width: 260px; height: 260px; border-radius: 50%;
      background: #ff62b8; filter: blur(100px); opacity: .17;
      top: 8%; left: 8%; pointer-events: none;
    }
    .card {
      position: relative;
      width: min(100%, 560px);
      padding: clamp(30px, 8vw, 58px) clamp(22px, 6vw, 44px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.19);
      border-radius: 28px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 24px 80px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      animation: appear 1s ease both;
    }
    .heart {
      font-size: clamp(54px, 13vw, 76px);
      display: inline-block;
      filter: drop-shadow(0 0 22px rgba(255,105,180,.45));
      animation: beat 1.5s ease-in-out infinite;
    }
    .tiny { color: #f7bfe1; letter-spacing: .22em; text-transform: uppercase; font-size: 11px; margin: 18px 0 14px; }
    h1 {
      margin: 0;
      font-size: clamp(29px, 7.3vw, 47px);
      line-height: 1.22;
      font-weight: 750;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    h1 span {
      background: linear-gradient(90deg, #ffc5e4, #ffffff, #d7c6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .message { margin: 22px 0 0; color: #e8ddec; font-size: 15px; line-height: 1.7; }
    .signature { margin-top: 28px; color: #ffb9df; font-size: 14px; }
    .floating {
      position: fixed; bottom: -40px; opacity: 0;
      animation: floatUp 8s linear infinite; pointer-events: none;
    }
    .floating:nth-of-type(1) { left: 12%; animation-delay: 0s; font-size: 22px; }
    .floating:nth-of-type(2) { left: 30%; animation-delay: 2s; font-size: 15px; }
    .floating:nth-of-type(3) { left: 70%; animation-delay: 1s; font-size: 25px; }
    .floating:nth-of-type(4) { left: 88%; animation-delay: 4s; font-size: 18px; }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: .8; } 85% { opacity: .7; } 100% { transform: translateY(-115vh) rotate(24deg); opacity: 0; } }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <span class="floating">💗</span><span class="floating">✨</span>
  <span class="floating">💕</span><span class="floating">💖</span>
  <main class="card">
    <div class="heart" aria-hidden="true">💗</div>
    <p class="tiny">Un mensajito para vos</p>
    <h1>Te quiero mucho <span>Crystalito</span>, aunque no me soportes y me detestes 🥰</h1>
    <p class="message">Por si se te olvida… aquí queda este recordatorio bonito. No acepto reclamos por exceso de cariño. 💌</p>
    <div class="signature">Hecho con cariño ♡</div>
  </main>
</body>
</html>
